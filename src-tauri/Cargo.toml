[package]
name = "textbook2md-desktop"
version = "0.1.0"
description = "Desktop shell for the textbook2md local-first PDF → Markdown knowledge-base engine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
