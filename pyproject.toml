[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook2md"
version = "0.1.0"
description = "Local-first engine converting textbook PDFs into a structured, source-traceable Markdown knowledge base"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
ocr = ["pytesseract>=0.3", "pillow>=10"]

[project.scripts]
textbook2md = "textbook2md.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
